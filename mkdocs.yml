# Fucina manual (https://matteo-grella.github.io/fucina/docs/) — BASE config.
#
# Do NOT add a nav here: `zig run tools/gen_docs_site.zig -- . .docs-site`
# stages the repo markdown (README.md, docs/, docs/course/,
# examples/*/README.md) into .docs-site with links resolved against the
# staged tree AND generates the nav (REFERENCE chapters, guides, course,
# examples are all enumerated from disk; a guide's sidebar title/group
# come from its own `<!-- docs-nav: ... -->` comment, see the tool's doc
# comment), appending it to this file as .mkdocs-gen.yml. The site builds
# from THAT file; the repo markdown stays the single source of truth.
#
# Local preview:
#   zig run tools/gen_docs_site.zig -- . .docs-site
#   pip install mkdocs-material && mkdocs serve -f .mkdocs-gen.yml
#
# Deployed by .github/workflows/pages.yml (landing page at /, this manual
# at /docs/).

site_name: Fucina
site_description: CPU-first tensor/autograd runtime and LLM inference engine in pure Zig
site_url: https://matteo-grella.github.io/fucina/docs/
repo_url: https://github.com/matteo-grella/fucina
repo_name: matteo-grella/fucina
edit_uri: ""
docs_dir: .docs-site
site_dir: .docs-site-out
strict: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - assets/extra.css

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

