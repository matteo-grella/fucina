name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos pinned (not -latest): the label migrates under our feet
        # (macOS 26 rollout); bump deliberately, with a green run.
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Unit tests (native backend)
        run: zig build test
      - name: Build all executables
        run: zig build
      - name: Compile bench suite
        run: zig build bench-check
      - name: Import-graph check
        run: zig build arch-check
      - name: Doc-index link check
        run: zig build doc-check
      - name: Reference snippet check
        run: zig build snippet-check
      - name: Cross-ISA dot parity check
        run: zig build x86dot-check
      - name: Unit tests (scalar reference backend)
        if: matrix.os == 'ubuntu-latest'
        run: zig build test -Dbackend=scalar
      - name: Unit tests (no-BLAS native backend)
        if: matrix.os == 'macos-15'
        run: zig build test -Dblas=none
      # GPU-provider compile legs: neither runner has a usable GPU, so both
      # providers are gated compile-only. cuda-check cross-compiles the CUDA
      # provider, its test roots, and the PTX generator for x86_64-linux-gnu
      # (no CUDA SDK involved; libcuda/cuBLAS are dlopen'd at runtime), so it
      # rides the ubuntu job; metal-check compiles the Metal provider and its
      # Objective-C shim against the Apple SDK, so it rides the macOS job.
      - name: Compile CUDA provider legs
        if: matrix.os == 'ubuntu-latest'
        run: zig build cuda-check
      - name: Compile Metal provider legs
        if: matrix.os == 'macos-15'
        run: zig build metal-check
      # -Dllguidance leg (vendor/llguidance is Rust; the runner image ships
      # cargo): un-skips the flag-gated tests and snippets, so the extern ABI,
      # the cargo build, and the staticlib link cannot bit-rot behind a green
      # default build — and Linux linking of the Rust staticlib stays proven.
      - name: Unit tests + snippets (llguidance leg)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo --version
          zig build test -Dllguidance=true
          zig build snippet-check -Dllguidance=true

  # Package-consumer gate: package the tracked tree (git archive) and consume
  # it from a scratch project via `zig fetch` + b.dependency — the README /
  # reference ch 2 consuming flow — so the manifest, the module exports, and the
  # module-carried BLAS linkage (Accelerate by default on macOS) cannot rot.
  consume:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Package the tracked tree
        run: git archive --prefix=fucina/ -o "$RUNNER_TEMP/fucina-pkg.tar.gz" HEAD
      - name: Consume as a package dependency
        run: |
          mkdir -p "$RUNNER_TEMP/consumer/src"
          cd "$RUNNER_TEMP/consumer"
          cat > build.zig.zon <<'ZON'
          .{
              .name = .fucina_consume,
              .version = "0.0.0",
              .fingerprint = 0xdddf23eb1e74c287,
              .minimum_zig_version = "0.16.0",
              .dependencies = .{},
              .paths = .{""},
          }
          ZON
          cat > build.zig <<'BUILD'
          const std = @import("std");

          pub fn build(b: *std.Build) void {
              const target = b.standardTargetOptions(.{});
              const optimize = b.standardOptimizeOption(.{});
              const fucina_dep = b.dependency("fucina", .{ .target = target, .optimize = optimize });
              const exe = b.addExecutable(.{
                  .name = "smoke",
                  .root_module = b.createModule(.{
                      .root_source_file = b.path("src/main.zig"),
                      .target = target,
                      .optimize = optimize,
                  }),
              });
              exe.root_module.addImport("fucina", fucina_dep.module("fucina"));
              exe.root_module.addImport("fucina_models", fucina_dep.module("fucina_models"));
              b.installArtifact(exe);
              const run = b.addRunArtifact(exe);
              b.step("run", "Run the smoke program").dependOn(&run.step);
          }
          BUILD
          # Single source: the consumer program IS examples/smoke/main.zig
          # (compile-gated in-tree by `zig build smoke`), so the two can never
          # drift apart. Only the fucina_models probe is appended here — the
          # smoke example does not import the models module.
          cp "$GITHUB_WORKSPACE/examples/smoke/main.zig" src/main.zig
          cat >> src/main.zig <<'MAIN'

          // Package-consumer probe: force semantic analysis of a
          // fucina_models decl so the second exported module really
          // compiles as a dependency.
          comptime {
              _ = @import("fucina_models").text.speculative;
          }
          MAIN
          zig fetch --save "$RUNNER_TEMP/fucina-pkg.tar.gz"
          zig build run -Doptimize=ReleaseFast | tee run-out.txt
          grep -q "loss=23" run-out.txt
          grep -q "grad_x=\[4, 5\]" run-out.txt
